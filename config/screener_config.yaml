# screener_config.yaml
# thresholds analysts can edit without touching engine.py
#
# note: the sprint doc lists 15 filterable metrics but the Dividend
# Champion preset needs a "dividend payout max" filter that isn't in
# that list of 15. Added dividend_payout_max as a 16th metric since the
# preset can't work without it.

metrics:
  roe_min:
    column: return_on_equity_pct
    direction: min
  de_max:
    column: debt_to_equity
    direction: max
    skip_financials: true
  de_exact:
    column: debt_to_equity
    direction: exact
    skip_financials: true
  fcf_min:
    column: free_cash_flow_cr
    direction: min
  revenue_cagr_5yr_min:
    column: revenue_cagr_5yr
    direction: min
  pat_cagr_5yr_min:
    column: pat_cagr_5yr
    direction: min
  opm_min:
    column: operating_profit_margin_pct
    direction: min
  pe_max:
    column: pe_ratio
    direction: max
  pb_max:
    column: pb_ratio
    direction: max
  dividend_yield_min:
    column: dividend_yield_pct
    direction: min
  icr_min:
    column: interest_coverage
    direction: min
    debt_free_passes: true
  market_cap_min:
    column: market_cap_crore
    direction: min
  net_profit_min:
    column: net_profit
    direction: min
  eps_cagr_min:
    column: eps_cagr_5yr
    direction: min
  asset_turnover_min:
    column: asset_turnover
    direction: min
  sales_min:
    column: sales
    direction: min
  dividend_payout_max:
    column: dividend_payout_ratio_pct
    direction: max

presets:
  quality_compounder:
    name: Quality Compounder
    filters:
      roe_min: 15
      de_max: 1.0
      fcf_min: 0
      revenue_cagr_5yr_min: 10

  value_pick:
    name: Value Pick
    filters:
      pe_max: 20
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1

  growth_accelerator:
    name: Growth Accelerator
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2.0

  dividend_champion:
    name: Dividend Champion
    filters:
      dividend_yield_min: 2
      dividend_payout_max: 80
      fcf_min: 0

  debt_free_blue_chip:
    name: Debt-Free Blue Chip
    filters:
      de_exact: 0
      roe_min: 12
      sales_min: 5000

  turnaround_watch:
    name: Turnaround Watch
    special: true
